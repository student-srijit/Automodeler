version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 324037324041.dkr.ecr.ap-southeast-1.amazonaws.com
  build:
    commands:
      - echo Building Docker image...
      - docker build --provenance=false -t automodeler-lambda .
      - docker tag automodeler-lambda:latest 324037324041.dkr.ecr.ap-southeast-1.amazonaws.com/automodeler-lambda:latest
  post_build:
    commands:
      - echo Pushing image to ECR...
      - docker push 324037324041.dkr.ecr.ap-southeast-1.amazonaws.com/automodeler-lambda:latest
      - echo Build and push complete!
